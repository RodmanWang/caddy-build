
name: Build and Release Caddy

on:
  workflow_dispatch:

  schedule:
    # 每天北京时间 02:15
    - cron: "15 18 * * *"

  push:
    paths:
      - ".github/workflows/**"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "**/*.sh"

permissions:
  contents: write
  actions: write

concurrency:
  group: caddy-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------
      # 1. 初始化 Go 环境
      # ------------------------------------------
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      # ------------------------------------------
      # 2. 显示北京时间
      # ------------------------------------------
      - name: Show Beijing Time
        shell: bash
        run: |
          echo "Current Beijing time:"
          TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S'

      # ------------------------------------------
      # 3. 安装构建工具
      # ------------------------------------------
      - name: Install build tools
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y jq

          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # ------------------------------------------
      # 4. 检测最新版本
      # ------------------------------------------
      - name: Resolve latest versions
        id: versions
        shell: bash
        run: |
          set -Eeuo pipefail

          get_latest() {
            curl -fsSL --retry 3 \
              "https://proxy.golang.org/$1/@latest" |
              jq -er '.Version'
          }

          CADDY_VERSION="$(get_latest github.com/caddyserver/caddy/v2)"
          CLOUDFLARE_VERSION="$(get_latest github.com/caddy-dns/cloudflare)"
          L4_VERSION="$(get_latest github.com/mholt/caddy-l4)"

          [[ "$CADDY_VERSION" =~ ^v[0-9] ]]
          [[ "$CLOUDFLARE_VERSION" =~ ^v[0-9] ]]
          [[ "$L4_VERSION" =~ ^v[0-9] ]]

          echo "caddy=$CADDY_VERSION" >> "$GITHUB_OUTPUT"
          echo "cloudflare=$CLOUDFLARE_VERSION" >> "$GITHUB_OUTPUT"
          echo "l4=$L4_VERSION" >> "$GITHUB_OUTPUT"

          {
            echo "### Latest versions"
            echo "- Caddy: $CADDY_VERSION"
            echo "- Cloudflare: $CLOUDFLARE_VERSION"
            echo "- caddy-l4: $L4_VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------
      # 5. 检查是否有更新
      # ------------------------------------------
      
      - name: Check for updates
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CADDY_VERSION: ${{ steps.versions.outputs.caddy }}
          CLOUDFLARE_VERSION: ${{ steps.versions.outputs.cloudflare }}
          L4_VERSION: ${{ steps.versions.outputs.l4 }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Checking previous Caddy release..."

          LATEST_TAG="$(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 1000 \
              --json tagName,publishedAt \
              --jq '[
                .[] |
                select(.tagName | startswith("caddy-build-"))
              ] | sort_by(.publishedAt) | last | .tagName // empty'
          )"

          NEEDS_BUILD=false

          if [[ -z "$LATEST_TAG" ]]; then
            echo "No previous release found."
            NEEDS_BUILD=true

          else
            echo "Previous release: $LATEST_TAG"

            mkdir -p "$RUNNER_TEMP/latest-release"

            gh release download "$LATEST_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern build-info.json \
              --dir "$RUNNER_TEMP/latest-release"

            OLD_INFO="$RUNNER_TEMP/latest-release/build-info.json"

            # 兼容旧版 build-info.json
            OLD_CADDY="$(jq -r '.caddy // empty' "$OLD_INFO")"
            OLD_CF="$(jq -r '.cloudflare // empty' "$OLD_INFO")"
            OLD_L4="$(jq -r '.l4 // empty' "$OLD_INFO")"
            OLD_COMMIT="$(jq -r '.source_commit // empty' "$OLD_INFO")"

            echo "=========================================="
            echo "Previous versions:"
            echo "Caddy:      $OLD_CADDY"
            echo "Cloudflare: $OLD_CF"
            echo "caddy-l4:   $OLD_L4"
            echo "Source:     ${OLD_COMMIT:-Not recorded}"
            echo "=========================================="

            echo "Current versions:"
            echo "Caddy:      $CADDY_VERSION"
            echo "Cloudflare: $CLOUDFLARE_VERSION"
            echo "caddy-l4:   $L4_VERSION"
            echo "Source:     $SOURCE_COMMIT"
            echo "=========================================="

            if [[ "$OLD_CADDY" != "$CADDY_VERSION" ]]; then
              echo "Caddy core updated."
              NEEDS_BUILD=true
            fi

            if [[ "$OLD_CF" != "$CLOUDFLARE_VERSION" ]]; then
              echo "Cloudflare plugin updated."
              NEEDS_BUILD=true
            fi

            if [[ "$OLD_L4" != "$L4_VERSION" ]]; then
              echo "caddy-l4 plugin updated."
              NEEDS_BUILD=true
            fi

            # 旧版没有 source_commit，首次升级时自动重新构建
            if [[ -z "$OLD_COMMIT" || "$OLD_COMMIT" != "$SOURCE_COMMIT" ]]; then
              echo "Repository source updated or not previously recorded."
              NEEDS_BUILD=true
            fi
          fi

          echo "=========================================="

          if [[ "$NEEDS_BUILD" == "true" ]]; then
            echo "Update detected. Starting build."

            echo "needs_build=true" >> "$GITHUB_OUTPUT"

            echo "### Update detected" >> "$GITHUB_STEP_SUMMARY"
            echo "A new build will be performed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No updates detected. Build skipped."

            echo "needs_build=false" >> "$GITHUB_OUTPUT"

            echo "### No updates detected" >> "$GITHUB_STEP_SUMMARY"
            echo "Compilation and release skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ------------------------------------------
      # 6. 编译并验证 AMD64 / ARM64
      # ------------------------------------------
      - name: Build and verify binaries
        if: steps.check.outputs.needs_build == 'true'
        env:
          CADDY_VERSION: ${{ steps.versions.outputs.caddy }}
          CLOUDFLARE_VERSION: ${{ steps.versions.outputs.cloudflare }}
          L4_VERSION: ${{ steps.versions.outputs.l4 }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p dist

          get_module_version() {
            local binary="$1"
            local module="$2"

            go version -m "$binary" |
              awk -v module="$module" '
                ($1 == "mod" || $1 == "dep") && $2 == module {
                  print $3
                  exit
                }
              '
          }

          for ARCH in amd64 arm64; do

            echo "=========================================="
            echo "Building linux/$ARCH"
            echo "=========================================="

            OUTPUT="dist/caddy-linux-$ARCH"

            GOOS=linux GOARCH="$ARCH" CGO_ENABLED=0 \
              xcaddy build "$CADDY_VERSION" \
                --with "github.com/caddy-dns/cloudflare@$CLOUDFLARE_VERSION" \
                --with "github.com/mholt/caddy-l4@$L4_VERSION" \
                --output "$OUTPUT"

            chmod 0755 "$OUTPUT"

            if [[ ! -s "$OUTPUT" ]]; then
              echo "ERROR: Binary missing or empty: $OUTPUT"
              exit 1
            fi

            MODULE_INFO="$(go version -m "$OUTPUT")"

            echo "Build metadata for linux/$ARCH:"
            echo "$MODULE_INFO"

            ACTUAL_CADDY="$(
              get_module_version "$OUTPUT" \
                "github.com/caddyserver/caddy/v2"
            )"

            ACTUAL_CF="$(
              get_module_version "$OUTPUT" \
                "github.com/caddy-dns/cloudflare"
            )"

            ACTUAL_L4="$(
              get_module_version "$OUTPUT" \
                "github.com/mholt/caddy-l4"
            )"

            echo "Caddy expected: $CADDY_VERSION"
            echo "Caddy actual:   $ACTUAL_CADDY"

            echo "Cloudflare expected: $CLOUDFLARE_VERSION"
            echo "Cloudflare actual:   $ACTUAL_CF"

            echo "caddy-l4 expected: $L4_VERSION"
            echo "caddy-l4 actual:   $ACTUAL_L4"

            [[ -n "$ACTUAL_CADDY" ]] || {
              echo "ERROR: Caddy core module missing"
              exit 1
            }

            [[ -n "$ACTUAL_CF" ]] || {
              echo "ERROR: Cloudflare module missing"
              exit 1
            }

            [[ -n "$ACTUAL_L4" ]] || {
              echo "ERROR: caddy-l4 module missing"
              exit 1
            }

            [[ "$ACTUAL_CADDY" == "$CADDY_VERSION" ]] || {
              echo "ERROR: Caddy version mismatch"
              exit 1
            }

            [[ "$ACTUAL_CF" == "$CLOUDFLARE_VERSION" ]] || {
              echo "ERROR: Cloudflare version mismatch"
              exit 1
            }

            [[ "$ACTUAL_L4" == "$L4_VERSION" ]] || {
              echo "ERROR: caddy-l4 version mismatch"
              exit 1
            }

            echo "linux/$ARCH verification passed."

          done

          # --------------------------------------
          # 生成构建信息
          # --------------------------------------
          jq -n \
            --arg caddy "$CADDY_VERSION" \
            --arg cloudflare "$CLOUDFLARE_VERSION" \
            --arg l4 "$L4_VERSION" \
            --arg source_commit "$GITHUB_SHA" \
            '{
              caddy: $caddy,
              cloudflare: $cloudflare,
              l4: $l4,
              source_commit: $source_commit
            }' > dist/build-info.json

          # --------------------------------------
          # 生成 SHA256
          # --------------------------------------
          cd dist

          sha256sum \
            caddy-linux-amd64 \
            caddy-linux-arm64 \
            build-info.json \
            > checksums.txt

          echo "Build files:"
          ls -lh

          echo "SHA256:"
          cat checksums.txt

      # ------------------------------------------
      # 7. 发布 GitHub Release
      # ------------------------------------------
      - name: Publish GitHub Release
        if: steps.check.outputs.needs_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CADDY_VERSION: ${{ steps.versions.outputs.caddy }}
          CLOUDFLARE_VERSION: ${{ steps.versions.outputs.cloudflare }}
          L4_VERSION: ${{ steps.versions.outputs.l4 }}
        shell: bash
        run: |
          set -Eeuo pipefail

          TAG="caddy-build-$(TZ='Asia/Shanghai' date +%Y%m%d)-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            dist/caddy-linux-amd64 \
            dist/caddy-linux-arm64 \
            dist/build-info.json \
            dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Caddy $CADDY_VERSION" \
            --notes "Caddy: $CADDY_VERSION
          Cloudflare: $CLOUDFLARE_VERSION
          caddy-l4: $L4_VERSION

          Hardware compatibility:

          1. caddy-linux-amd64
             Linux x86_64 / AMD64
             For Intel and AMD 64-bit processors.

          2. caddy-linux-arm64
             Linux ARM64 / AArch64
             For 64-bit ARM processors, such as AWS Graviton and ARM-based servers.

          Source commit: $GITHUB_SHA

          Built and verified by GitHub Actions." \
            --latest

          echo "Release published: $TAG"

          {
            echo "### Release published"
            echo "- Tag: $TAG"
            echo "- Caddy: $CADDY_VERSION"
            echo "- Cloudflare: $CLOUDFLARE_VERSION"
            echo "- caddy-l4: $L4_VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------
      # 8. 清理旧 Release
      # ------------------------------------------
      - name: Delete old Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          CUTOFF="$(date -u -d '7 days ago' +%s)"

          # 找到最新的 Caddy Release
          LATEST_TAG="$(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 1000 \
              --json tagName,publishedAt \
              --jq '[
                .[] |
                select(.tagName | startswith("caddy-build-"))
              ] | sort_by(.publishedAt) | last | .tagName // empty'
          )"

          echo "Latest Caddy release: $LATEST_TAG"

          echo "Cleaning Releases older than 7 days..."
          echo "Cutoff: $(date -u -d "@$CUTOFF" '+%Y-%m-%d %H:%M:%S UTC')"

          while IFS=$'\t' read -r TAG PUBLISHED_AT; do

            [[ -n "$TAG" && -n "$PUBLISHED_AT" ]] || continue

            # 永远保留最新版本
            if [[ "$TAG" == "$LATEST_TAG" ]]; then
              echo "Keeping latest Release: $TAG"
              continue
            fi

            PUBLISHED_TS="$(date -u -d "$PUBLISHED_AT" +%s)"

            if (( PUBLISHED_TS < CUTOFF )); then

              echo "Deleting old Release: $TAG ($PUBLISHED_AT)"

              gh release delete "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --yes \
                --cleanup-tag

            else
              echo "Keeping Release: $TAG ($PUBLISHED_AT)"
            fi

          done < <(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 1000 \
              --json tagName,publishedAt \
              --jq '.[] |
                select(.tagName | startswith("caddy-build-")) |
                [.tagName, .publishedAt] | @tsv'
          )

          echo "Release cleanup completed."

      # ------------------------------------------
      # 9. 清理旧 GitHub Actions 运行记录
      # ------------------------------------------
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 7
          keep_minimum_runs: 7
