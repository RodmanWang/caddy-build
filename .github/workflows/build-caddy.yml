
name: 构建并发布 Caddy

on:
  workflow_dispatch:

  schedule:
    - cron: "15 6,14,22 * * *"
      timezone: 'Asia/Shanghai'

  push:
    paths:
      - ".github/workflows/**"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "**/*.sh"

permissions:
  contents: write
  actions: write

concurrency:
  group: caddy-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------
      # 1. 初始化 Go 环境
      # ------------------------------------------
      - name: 安装 Go 环境
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      # ------------------------------------------
      # 2. 显示北京时间
      # ------------------------------------------
      - name: 显示北京时间
        shell: bash
        run: |
          echo "当前北京时间："
          TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S'

      # ------------------------------------------
      # 3. 安装构建工具
      # ------------------------------------------
      - name: 安装构建工具
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y jq

          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # ------------------------------------------
      # 4. 检测最新版本
      # ------------------------------------------
      - name: 获取最新依赖版本
        id: versions
        shell: bash
        run: |
          set -Eeuo pipefail

          get_latest() {
            curl -fsSL --retry 3 \
              "https://proxy.golang.org/$1/@latest" |
              jq -er '.Version'
          }

          CADDY_VERSION="$(get_latest github.com/caddyserver/caddy/v2)"
          CLOUDFLARE_VERSION="$(get_latest github.com/caddy-dns/cloudflare)"
          L4_VERSION="$(get_latest github.com/mholt/caddy-l4)"

          [[ "$CADDY_VERSION" =~ ^v[0-9] ]]
          [[ "$CLOUDFLARE_VERSION" =~ ^v[0-9] ]]
          [[ "$L4_VERSION" =~ ^v[0-9] ]]

          echo "caddy=$CADDY_VERSION" >> "$GITHUB_OUTPUT"
          echo "cloudflare=$CLOUDFLARE_VERSION" >> "$GITHUB_OUTPUT"
          echo "l4=$L4_VERSION" >> "$GITHUB_OUTPUT"

          {
            echo "### 最新版本信息"
            echo "- Caddy 核心：$CADDY_VERSION"
            echo "- Cloudflare 插件：$CLOUDFLARE_VERSION"
            echo "- caddy-l4 插件：$L4_VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------
      # 5. 检查是否有更新
      # ------------------------------------------
      
      - name: 检查依赖和源码更新
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CADDY_VERSION: ${{ steps.versions.outputs.caddy }}
          CLOUDFLARE_VERSION: ${{ steps.versions.outputs.cloudflare }}
          L4_VERSION: ${{ steps.versions.outputs.l4 }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "正在检查上一次 Caddy 发布记录……"

          LATEST_TAG="$(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 1000 \
              --json tagName,publishedAt \
              --jq '[
                .[] |
                select(.tagName | startswith("caddy-build-"))
              ] | sort_by(.publishedAt) | last | .tagName // empty'
          )"

          NEEDS_BUILD=false

          if [[ -z "$LATEST_TAG" ]]; then
            echo "未找到历史发布记录。"
            NEEDS_BUILD=true

          else
            echo "上一次发布：$LATEST_TAG"

            mkdir -p "$RUNNER_TEMP/latest-release"

            gh release download "$LATEST_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern build-info.json \
              --dir "$RUNNER_TEMP/latest-release"

            OLD_INFO="$RUNNER_TEMP/latest-release/build-info.json"

            # 兼容旧版 build-info.json
            OLD_CADDY="$(jq -r '.caddy // empty' "$OLD_INFO")"
            OLD_CF="$(jq -r '.cloudflare // empty' "$OLD_INFO")"
            OLD_L4="$(jq -r '.l4 // empty' "$OLD_INFO")"
            OLD_COMMIT="$(jq -r '.source_commit // empty' "$OLD_INFO")"

            echo "=========================================="
            echo "上一次构建使用的版本："
            echo "Caddy 核心：  $OLD_CADDY"
            echo "Cloudflare：  $OLD_CF"
            echo "caddy-l4：    $OLD_L4"
            echo "源码提交：    ${OLD_COMMIT:-未记录}"
            echo "=========================================="

            echo "本次检测到的版本："
            echo "Caddy 核心：  $CADDY_VERSION"
            echo "Cloudflare：  $CLOUDFLARE_VERSION"
            echo "caddy-l4：    $L4_VERSION"
            echo "源码提交：    $SOURCE_COMMIT"
            echo "=========================================="

            if [[ "$OLD_CADDY" != "$CADDY_VERSION" ]]; then
              echo "检测到 Caddy 核心版本更新。"
              NEEDS_BUILD=true
            fi

            if [[ "$OLD_CF" != "$CLOUDFLARE_VERSION" ]]; then
              echo "检测到 Cloudflare 插件版本更新。"
              NEEDS_BUILD=true
            fi

            if [[ "$OLD_L4" != "$L4_VERSION" ]]; then
              echo "检测到 caddy-l4 插件版本更新。"
              NEEDS_BUILD=true
            fi

            # 旧版没有 source_commit，首次升级时自动重新构建
            if [[ -z "$OLD_COMMIT" || "$OLD_COMMIT" != "$SOURCE_COMMIT" ]]; then
              echo "仓库源码已更新，或历史记录中没有源码提交信息。"
              NEEDS_BUILD=true
            fi
          fi

          echo "=========================================="

          if [[ "$NEEDS_BUILD" == "true" ]]; then
            echo "检测到更新，开始构建。"

            echo "needs_build=true" >> "$GITHUB_OUTPUT"

            echo "### 检测到更新" >> "$GITHUB_STEP_SUMMARY"
            echo "即将执行新一轮构建。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "未检测到更新，跳过构建。"

            echo "needs_build=false" >> "$GITHUB_OUTPUT"

            echo "### 未检测到更新" >> "$GITHUB_STEP_SUMMARY"
            echo "本次跳过编译和发布。" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ------------------------------------------
      # 6. 编译并验证 AMD64 / ARM64
      # ------------------------------------------
      - name: 构建并验证二进制文件
        if: steps.check.outputs.needs_build == 'true'
        env:
          CADDY_VERSION: ${{ steps.versions.outputs.caddy }}
          CLOUDFLARE_VERSION: ${{ steps.versions.outputs.cloudflare }}
          L4_VERSION: ${{ steps.versions.outputs.l4 }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p dist

          get_module_version() {
            local binary="$1"
            local module="$2"

            go version -m "$binary" |
              awk -v module="$module" '
                ($1 == "mod" || $1 == "dep") && $2 == module {
                  print $3
                  exit
                }
              '
          }

          for ARCH in amd64 arm64; do

            echo "=========================================="
            echo "正在构建 Linux/$ARCH 版本"
            echo "=========================================="

            OUTPUT="dist/caddy-linux-$ARCH"

            GOOS=linux GOARCH="$ARCH" CGO_ENABLED=0 \
              xcaddy build "$CADDY_VERSION" \
                --with "github.com/caddy-dns/cloudflare@$CLOUDFLARE_VERSION" \
                --with "github.com/mholt/caddy-l4@$L4_VERSION" \
                --output "$OUTPUT"

            chmod 0755 "$OUTPUT"

            if [[ ! -s "$OUTPUT" ]]; then
              echo "错误：二进制文件不存在或为空：$OUTPUT"
              exit 1
            fi

            MODULE_INFO="$(go version -m "$OUTPUT")"

            echo "Linux/$ARCH 构建元数据："
            echo "$MODULE_INFO"

            ACTUAL_CADDY="$(
              get_module_version "$OUTPUT" \
                "github.com/caddyserver/caddy/v2"
            )"

            ACTUAL_CF="$(
              get_module_version "$OUTPUT" \
                "github.com/caddy-dns/cloudflare"
            )"

            ACTUAL_L4="$(
              get_module_version "$OUTPUT" \
                "github.com/mholt/caddy-l4"
            )"

            echo "Caddy 核心预期版本：$CADDY_VERSION"
            echo "Caddy 核心实际版本：$ACTUAL_CADDY"

            echo "Cloudflare 插件预期版本：$CLOUDFLARE_VERSION"
            echo "Cloudflare 插件实际版本：$ACTUAL_CF"

            echo "caddy-l4 插件预期版本：$L4_VERSION"
            echo "caddy-l4 插件实际版本：$ACTUAL_L4"

            [[ -n "$ACTUAL_CADDY" ]] || {
              echo "错误：未在二进制文件中找到 Caddy 核心模块"
              exit 1
            }

            [[ -n "$ACTUAL_CF" ]] || {
              echo "错误：未在二进制文件中找到 Cloudflare 模块"
              exit 1
            }

            [[ -n "$ACTUAL_L4" ]] || {
              echo "错误：未在二进制文件中找到 caddy-l4 模块"
              exit 1
            }

            [[ "$ACTUAL_CADDY" == "$CADDY_VERSION" ]] || {
              echo "错误：Caddy 核心版本与预期不一致"
              exit 1
            }

            [[ "$ACTUAL_CF" == "$CLOUDFLARE_VERSION" ]] || {
              echo "错误：Cloudflare 插件版本与预期不一致"
              exit 1
            }

            [[ "$ACTUAL_L4" == "$L4_VERSION" ]] || {
              echo "错误：caddy-l4 插件版本与预期不一致"
              exit 1
            }

            echo "Linux/$ARCH 版本验证通过。"

          done

          # --------------------------------------
          # 生成构建信息
          # --------------------------------------
          jq -n \
            --arg caddy "$CADDY_VERSION" \
            --arg cloudflare "$CLOUDFLARE_VERSION" \
            --arg l4 "$L4_VERSION" \
            --arg source_commit "$GITHUB_SHA" \
            '{
              caddy: $caddy,
              cloudflare: $cloudflare,
              l4: $l4,
              source_commit: $source_commit
            }' > dist/build-info.json

          # --------------------------------------
          # 生成 SHA256
          # --------------------------------------
          cd dist

          sha256sum \
            caddy-linux-amd64 \
            caddy-linux-arm64 \
            build-info.json \
            > checksums.txt

          echo "构建产物："
          ls -lh

          echo "SHA256 校验值："
          cat checksums.txt

      # ------------------------------------------
      # 7. 发布 GitHub Release
      # ------------------------------------------
      - name: 发布 GitHub Release
        if: steps.check.outputs.needs_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CADDY_VERSION: ${{ steps.versions.outputs.caddy }}
          CLOUDFLARE_VERSION: ${{ steps.versions.outputs.cloudflare }}
          L4_VERSION: ${{ steps.versions.outputs.l4 }}
        shell: bash
        run: |
          set -Eeuo pipefail

          TAG="caddy-build-$(TZ='Asia/Shanghai' date +%Y%m%d)-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            dist/caddy-linux-amd64 \
            dist/caddy-linux-arm64 \
            dist/build-info.json \
            dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Caddy $CADDY_VERSION 发布版" \
            --notes "Caddy 核心版本：$CADDY_VERSION
          Cloudflare 插件版本：$CLOUDFLARE_VERSION
          caddy-l4 插件版本：$L4_VERSION

          硬件架构兼容性：

          1. caddy-linux-amd64
             Linux x86_64 / AMD64
             适用于 Intel 和 AMD 的 64 位处理器。

          2. caddy-linux-arm64
             Linux ARM64 / AArch64
             适用于 AWS Graviton 等 64 位 ARM 处理器及 ARM 架构服务器。

          源码提交：$GITHUB_SHA

          由 GitHub Actions 自动构建并完成验证。" \
            --latest

          echo "发布完成：$TAG"

          {
            echo "### 发布成功"
            echo "- 发布标签：$TAG"
            echo "- Caddy 核心：$CADDY_VERSION"
            echo "- Cloudflare 插件：$CLOUDFLARE_VERSION"
            echo "- caddy-l4 插件：$L4_VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------
      # 8. 清理旧 Release
      # ------------------------------------------
      - name: 清理过期 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          CUTOFF="$(date -u -d '7 days ago' +%s)"

          # 找到最新的 Caddy 发布版本
          LATEST_TAG="$(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 1000 \
              --json tagName,publishedAt \
              --jq '[
                .[] |
                select(.tagName | startswith("caddy-build-"))
              ] | sort_by(.publishedAt) | last | .tagName // empty'
          )"

          echo "最新的 Caddy 发布版本：$LATEST_TAG"

          echo "正在清理发布超过 7 天的旧版本……"
          echo "清理时间界限：$(date -u -d "@$CUTOFF" '+%Y-%m-%d %H:%M:%S UTC')"

          while IFS=$'\t' read -r TAG PUBLISHED_AT; do

            [[ -n "$TAG" && -n "$PUBLISHED_AT" ]] || continue

            # 永远保留最新版本
            if [[ "$TAG" == "$LATEST_TAG" ]]; then
              echo "保留最新发布版本：$TAG"
              continue
            fi

            PUBLISHED_TS="$(date -u -d "$PUBLISHED_AT" +%s)"

            if (( PUBLISHED_TS < CUTOFF )); then

              echo "正在删除过期发布版本：$TAG（发布时间：$PUBLISHED_AT）"

              gh release delete "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --yes \
                --cleanup-tag

            else
              echo "保留发布版本：$TAG（发布时间：$PUBLISHED_AT）"
            fi

          done < <(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 1000 \
              --json tagName,publishedAt \
              --jq '.[] |
                select(.tagName | startswith("caddy-build-")) |
                [.tagName, .publishedAt] | @tsv'
          )

          echo "旧版 Release 清理完成。"

      # ------------------------------------------
      # 9. 清理旧 GitHub Actions 运行记录
      # ------------------------------------------
      - name: 清理过期的 GitHub Actions 运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 7
          keep_minimum_runs: 7
